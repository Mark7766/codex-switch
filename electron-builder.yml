appId: io.github.mark7766.codex-switch
productName: Codex Switch
copyright: Copyright © 2026 Codex Switch Contributors
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - package.json
  - '!**/*.map'
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: CHANGELOG.md
    to: CHANGELOG.md
  - from: build/logo-codex.png
    to: build/logo-codex.png
  - from: build/logo-claude.svg
    to: build/logo-claude.svg
  - from: electron/codex/deepseek-models.json
    to: electron/codex/deepseek-models.json
  - from: docs/help
    to: docs/help
    filter: ['**/*']
  - from: docs/qa.png
    to: docs/qa.png
asar: true
asarUnpack:
  - 'dist/electron/preload.js'
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: Codex-Switch-${version}-mac-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: Codex-Switch-Setup-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Codex Switch
dmg:
  title: Codex Switch ${version}
  writeUpdateInfo: true
  format: UDZO
  sign: false
  background: null
publish:
  provider: github
  owner: Mark7766
  repo: codex-switch
  releaseType: release
